# Include inside the target site's server {} block. Check with nginx -t first.
# Images in WebP and files already compressed as WOFF2 do not need gzip.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml font/ttf;
# text/html is compressed by nginx automatically when gzip is enabled.
# Keep CMS routing, canonical-host redirects and cache policy in the main config.
