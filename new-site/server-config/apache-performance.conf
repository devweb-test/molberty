# Include in the site's Apache virtual host or its permitted .htaccess context.
# CMS routing and redirect rules remain separate. Do not cache unversioned HTML,
# app.js, data.js or CSS with immutable / a year-long max-age.
<IfModule mod_deflate.c>
  <IfModule mod_filter.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml font/ttf
  </IfModule>
</IfModule>
